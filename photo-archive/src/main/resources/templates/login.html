<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-box {
            background-color: #ede9fe;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #6d28d9;
        }
        .btn-purple {
            background-color: #a78bfa;
            border: none;
            color: white;
        }
        .btn-purple:hover {
            background-color: #8b5cf6;
        }
        a {
            color: #7c3aed;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2 class="text-center mb-4">Вход</h2>

    <div th:if="${param.errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 text-center mt-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
             class="bi bi-exclamation-triangle-fill flex-shrink-0" viewBox="0 0 16 16" role="img" aria-label="Предупреждение:">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.964 0L.165 13.233c-.457.778.091 1.767.982 1.767h13.707c.89 0 1.438-.99.982-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1-2.002 0 1 1 0 0 1 2.002 0z"/>
        </svg>
        <span th:text="${param.errorMessage}"></span>
    </div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="example@example.com">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Введите пароль">
        </div>
        <button type="submit" class="btn btn-purple w-100">Войти</button>
    </form>
    <div class="text-center mt-3">
        <a href="/register">Нет аккаунта? Зарегистрируйтесь</a>
    </div>
</div>

</body>
</html>
