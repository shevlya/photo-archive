<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование фотографа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f4ff;
            color: #4b3f72;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2em;
        }

        .form-container {
            background-color: #f3ebfd;
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(140, 108, 207, 0.15);
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #6a5acd;
            margin-bottom: 1.5em;
        }

        .btn-purple {
            background: linear-gradient(145deg, #d3b6f3, #b892e0);
            color: white;
            border: none;
        }

        .btn-purple:hover {
            background: linear-gradient(145deg, #b892e0, #a780d9);
        }

        .form-label {
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Редактирование фотографа</h1>
    <form th:action="@{'/photographers/edit/' + ${photographer.id}}" th:object="${photographer}" method="post">
        <div class="mb-3">
            <label for="firstName" class="form-label">Имя</label>
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
        </div>

        <div class="mb-3">
            <label for="birthDate" class="form-label">Дата рождения</label>
            <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}">
        </div>

        <div class="mb-3">
            <label for="specialization" class="form-label">Специализация</label>
            <input type="text" class="form-control" id="specialization" th:field="*{specialization}">
        </div>

        <div class="mb-3">
            <label for="contactInfo" class="form-label">Контактная информация</label>
            <input type="text" class="form-control" id="contactInfo" th:field="*{contactInfo}">
        </div>

        <div class="mb-3">
            <label for="biography" class="form-label">Биография</label>
            <textarea class="form-control" id="biography" rows="5" th:field="*{biography}"></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="/photographers" class="btn btn-outline-secondary">Назад</a>
            <button type="submit" class="btn btn-purple">Сохранить изменения</button>
        </div>
    </form>
</div>

</body>
</html>
