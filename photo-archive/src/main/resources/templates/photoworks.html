<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Фотоработы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f4ff;
            color: #4b3f72;
            margin: 0;
            padding-top: 80px;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(140, 108, 207, 0.2);
        }

        .navbar-nav .nav-link {
            color: #4b3f72;
            font-weight: 600;
            margin-right: 1rem;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #6a5acd;
        }

        .profile-link {
            color: #4b3f72;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-link:hover {
            color: #6a5acd;
            text-decoration: none;
        }

        .profile-icon {
            font-size: 1.5rem;
        }

        .card {
            border: none;
            background-color: #f3ebfd;
            box-shadow: 0 4px 8px rgba(140, 108, 207, 0.15);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(120, 88, 190, 0.25);
        }

        .btn-add {
            background: linear-gradient(145deg, #d3b6f3, #b892e0);
            border: none;
            color: white;
        }

        .btn-add:hover {
            background: linear-gradient(145deg, #b892e0, #a780d9);
        }

        h1 {
            color: #6a5acd;
        }

        .text-muted small {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/photographers">
            <img src="/logo.svg" alt="Логотип ФотоПортал" height="32" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/photoworks" th:classappend="${activePage == 'photoworks'} ? 'active'">Фотоработы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/exhibitions" th:classappend="${activePage == 'exhibitions'} ? 'active'">Выставки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/genres" th:classappend="${activePage == 'genres'} ? 'active'">Список жанров</a>
                </li>
            </ul>
            <div class="d-flex align-items-center ms-auto">
                <a href="/profile" class="profile-link">
                    <i class="bi bi-person-circle profile-icon"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Фотоработы</h1>
        <a href="/photoworks/new" class="btn btn-add d-flex align-items-center gap-2">
            <i class="bi bi-plus-circle"></i>
            <span>Добавить</span>
        </a>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(photoWorks)}">
        <div class="col-md-6 col-lg-4" th:each="work : ${photoWorks}">
            <div class="card p-3">
                <img th:src="${work.filePath}" class="card-img-top img-fluid rounded mb-3" alt="Фоторабота" th:if="${work.filePath}" />

                <div class="card-body">
                    <h5 class="card-title" th:text="${work.title}">Название работы</h5>
                    <p class="card-text text-muted">
                        <i class="bi bi-calendar-event"></i>
                        <span th:text="${#temporals.format(work.creationDate, 'dd.MM.yyyy')}"></span>
                    </p>
                    <p class="card-text text-muted" th:if="${work.photographer}">
                        <i class="bi bi-person-fill"></i>
                        <span th:text="${work.photographer.firstName + ' ' + work.photographer.lastName}">Фотограф</span>
                    </p>
                    <p class="card-text text-muted" th:if="${work.technique}">
                        <i class="bi bi-brush"></i>
                        <span th:text="${work.technique}">Техника</span>
                    </p>
                    <p class="card-text text-muted" th:if="${work.description}">
                        <i class="bi bi-card-text"></i>
                        <span th:text="${work.description}">Описание</span>
                    </p>
                    <p class="card-text text-muted" th:if="${work.status}">
                        <i class="bi bi-info-circle"></i>
                        <span th:text="${work.status}">Статус</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(photoWorks)}" class="text-center text-muted mt-5">
        <i class="bi bi-images" style="font-size: 2rem;"></i>
        <p class="mt-2">Фоторабот пока нет</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
