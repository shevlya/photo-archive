<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f1fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .profile-card {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 6px 15px rgba(128, 102, 179, 0.15);
            padding: 2.5rem;
            max-width: 600px;
            margin: auto;
        }
        h3 {
            color: #7d6eaa;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        label {
            color: #9b8fcc;
            font-weight: 500;
        }
        .form-control {
            border: 1.5px solid #d6cfee;
            border-radius: 0.5rem;
            background-color: #faf8fe;
            color: #5e5680;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #a89bde;
            box-shadow: 0 0 8px rgba(168, 155, 222, 0.6);
            background-color: #ffffff;
            color: #4a4381;
        }
        .form-control.invalid {
            border-color: #b33a3a !important;
            background-color: #f9eaea;
            box-shadow: 0 0 8px rgba(179, 58, 58, 0.6);
            color: #7a2d2d;
        }
        .btn-save {
            background-color: #b3a6e1;
            border: none;
            color: #3a2c6f;
            font-weight: 600;
            border-radius: 0.5rem;
            padding: 0.5rem 1.5rem;
            transition: background-color 0.3s ease;
        }
        .btn-save:hover {
            background-color: #9c8bd1;
            color: #2f2457;
        }
        .btn-outline-secondary {
            color: #9b8fcc;
            border-color: #d6cfee;
            border-radius: 0.5rem;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-outline-secondary:hover {
            background-color: #d6cfee;
            color: #6e5ea3;
            border-color: #a89bde;
        }
        .d-flex.justify-content-between {
            margin-top: 1.5rem;
        }
        .error-message {
            color: #b33a3a;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body class="container mt-5">
<div class="profile-card">
    <h3>Редактировать профиль</h3>
    <form id="profileForm" method="post" action="/profile/update" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    th:value="${user.email}"
                    required
                    readonly>
            <div class="error-message" id="emailError">Введите корректный email.</div>
        </div>
        <div class="mb-3">
            <label for="firstName" class="form-label">Имя</label>
            <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    name="firstName"
                    th:value="${user.firstName}"
                    pattern="^[A-Za-zА-Яа-яЁё\- ]+$"
                    required>
            <div class="error-message" id="firstNameError">Имя не должно содержать цифры и спецсимволы.</div>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    name="lastName"
                    th:value="${user.lastName}"
                    pattern="^[A-Za-zА-Яа-яЁё\- ]+$"
                    required>
            <div class="error-message" id="lastNameError">Фамилия не должна содержать цифры и спецсимволы.</div>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Роль</label>
            <input
                    type="text"
                    id="role"
                    name="role"
                    class="form-control"
                    th:value="${user.role}"
                    th:attr="readonly=${user.role == 'ROLE_USER'} ? 'readonly' : null"
            />
        </div>
        <div class="d-flex justify-content-between">
            <a href="/photographers" class="btn btn-outline-secondary">На главную</a>
            <button type="submit" class="btn btn-save">Сохранить изменения</button>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('profileForm');

    // Проверка паттерна для имени/фамилии
    const namePattern = /^[A-Za-zА-Яа-яЁё\- ]+$/;

    // Функция проверки и отображения ошибок
    function validateField(field, errorElem, pattern = null) {
        const value = field.value.trim();
        let valid = true;

        if (field.required && value === '') {
            valid = false;
        } else if (pattern && !pattern.test(value)) {
            valid = false;
        } else if (field.type === 'email' && !field.checkValidity()) {
            valid = false;
        }

        if (!valid) {
            field.classList.add('invalid');
            errorElem.style.display = 'block';
        } else {
            field.classList.remove('invalid');
            errorElem.style.display = 'none';
        }

        return valid;
    }

    // Поля и соответствующие элементы ошибок
    const firstNameField = form.firstName;
    const firstNameError = document.getElementById('firstNameError');

    const lastNameField = form.lastName;
    const lastNameError = document.getElementById('lastNameError');

    const emailField = form.email;
    const emailError = document.getElementById('emailError');

    // Валидация при вводе (реальное время)
    firstNameField.addEventListener('input', () => {
        validateField(firstNameField, firstNameError, namePattern);
    });
    lastNameField.addEventListener('input', () => {
        validateField(lastNameField, lastNameError, namePattern);
    });
    emailField.addEventListener('input', () => {
        validateField(emailField, emailError);
    });

    // Проверка при отправке формы
    form.addEventListener('submit', function(event) {
        let valid = true;
        valid &= validateField(firstNameField, firstNameError, namePattern);
        valid &= validateField(lastNameField, lastNameError, namePattern);
        valid &= validateField(emailField, emailError);

        if (!valid) {
            event.preventDefault();
        }
    });
</script>

</body>
</html>
