<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Добавить фотографа</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f0f8;
      color: #4b3b61;
      margin: 0;
      padding: 40px;
    }
    .form-card {
      background-color: #f3ebfd;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(140, 108, 207, 0.15);
      padding: 30px;
    }
    .btn-purple {
      background-color: #b892e0;
      color: white;
      border: none;
    }
    .btn-purple:hover {
      background-color: #a780d9;
    }
    .btn-secondary {
      background-color: #d7c4f3;
      color: #4e3b73;
    }
    h1 {
      color: #6a5acd;
    }
  </style>
</head>
<body>

<div class="container my-5">
  <h1 class="mb-4 text-center">Добавление нового фотографа</h1>

  <div class="form-card mx-auto" style="max-width: 600px;">
    <form th:action="@{/photographers}" th:object="${photographer}" method="post">
      <div class="mb-3">
        <label class="form-label">Имя</label>
        <input type="text" th:field="*{firstName}" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Фамилия</label>
        <input type="text" th:field="*{lastName}" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Дата рождения</label>
        <input type="date" th:field="*{birthDate}" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">Биография</label>
        <textarea th:field="*{biography}" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Контакты</label>
        <input type="text" th:field="*{contactInfo}" class="form-control" />
      </div>

      <div class="mb-4">
        <label class="form-label">Специализация</label>
        <input type="text" th:field="*{specialization}" class="form-control" />
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-purple">Сохранить</button>
        <a href="/photographers" class="btn btn-secondary">Назад</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
