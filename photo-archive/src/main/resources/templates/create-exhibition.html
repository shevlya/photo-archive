<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать выставку</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f4ff;
            color: #4b3f72;
            margin: 0;
            padding-top: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #f3ebfd;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(120, 88, 190, 0.1);
        }

        h2 {
            color: #6a5acd;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        label {
            font-weight: 500;
            color: #4b3f72;
            margin-top: 1rem;
            display: block;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #d8c3ff;
            border-radius: 8px;
            background-color: #fff;
            margin-top: 0.3rem;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(145deg, #d3b6f3, #b892e0);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1.5rem;
            width: 100%;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(145deg, #b892e0, #a780d9);
        }

        a.back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #6a5acd;
            text-decoration: none;
            font-weight: 500;
        }

        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Создать новую выставку</h2>

    <form th:action="@{/exhibitions}" th:object="${exhibition}" method="post">
        <label>Название:
            <input type="text" th:field="*{title}" required />
        </label>

        <label>Место проведения:
            <input type="text" th:field="*{location}" required />
        </label>

        <label>Дата начала:
            <input type="date" th:field="*{startDate}" required />
        </label>

        <label>Дата окончания:
            <input type="date" th:field="*{endDate}" required />
        </label>

        <label>Описание:
            <textarea th:field="*{description}"></textarea>
        </label>

        <button type="submit">Создать</button>
    </form>

    <a class="back-link" th:href="@{/exhibitions}"><i class="bi bi-arrow-left-circle"></i> Назад к списку</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
