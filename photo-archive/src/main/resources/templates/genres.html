<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Список жанров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f4ff;
            color: #4b3f72;
            margin: 0;
            padding-top: 80px;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(140, 108, 207, 0.2);
        }

        .navbar-nav .nav-link {
            color: #4b3f72;
            font-weight: 600;
            margin-right: 1rem;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #6a5acd;
        }

        .profile-link {
            color: #4b3f72;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-link:hover {
            color: #6a5acd;
            text-decoration: none;
        }

        .profile-icon {
            font-size: 1.5rem;
        }

        h1 {
            color: #6a5acd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(150, 120, 200, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 1em;
            text-align: left;
            border-bottom: 1px solid #e0d6f5;
        }

        th {
            background-color: #e7dcf9;
            color: #4b3f72;
        }

        tr:hover {
            background-color: #f0e8ff;
        }

        a.button {
            background-color: #d8c3ff;
            padding: 0.5em 1em;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            margin-top: 1em;
            color: #4b3f72;
            font-weight: bold;
            text-decoration: none;
        }

        a.button:hover {
            background-color: #c3aaff;
            text-decoration: none;
        }

        .action-buttons {
            display: flex;
            gap: 0.5em;
        }

        .action-buttons a,
        .action-buttons button {
            width: 38px;
            height: 38px;
            padding: 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-buttons i {
            font-size: 1.2em;
        }

        .edit-btn {
            background-color: #e5d0fb;
            color: #5a3a87;
        }

        .edit-btn:hover {
            background-color: #d6b8f5;
        }

        .delete-btn {
            background-color: #f2d1f7;
            color: #792b7b;
        }

        .delete-btn:hover {
            background-color: #e2b3ec;
        }

        .text-center {
            text-align: center;
            color: #6d529c;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(100, 80, 130, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #f8f4ff;
            padding: 2em;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(150, 120, 200, 0.3);
            text-align: center;
            color: #4b3f72;
            max-width: 400px;
        }

        .modal-buttons {
            margin-top: 1.5em;
            display: flex;
            justify-content: center;
            gap: 1em;
        }

        .modal-buttons button {
            padding: 0.6em 1.2em;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .confirm-btn {
            background-color: #d8c3ff;
            color: #4b3f72;
        }

        .confirm-btn:hover {
            background-color: #c3aaff;
        }

        .cancel-btn {
            background-color: #e0d6f5;
            color: #5a3a87;
        }

        .cancel-btn:hover {
            background-color: #d6b8f5;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/photographers">
            <img src="/logo.svg" alt="Логотип ФотоПортал" height="32" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/photoworks" th:classappend="${activePage == 'photoworks'} ? 'active'">Фотоработы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/exhibitions" th:classappend="${activePage == 'exhibitions'} ? 'active'">Выставки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/genres" th:classappend="${activePage == 'genres'} ? 'active'">Список жанров</a>
                </li>
            </ul>
            <div class="d-flex align-items-center ms-auto">
                <a href="/profile" class="profile-link">
                    <i class="bi bi-person-circle profile-icon"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Жанры</h1>
        <a class="button" href="/genres/new" title="Добавить жанр">
            <i class="bi bi-plus-circle"></i> Добавить жанр
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Название жанра</th>
            <th style="width: 120px;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="g : ${genres}">
            <td th:text="${g.name}">Жанр</td>
            <td class="action-buttons">
                <a th:href="@{'/genres/edit/' + ${g.id}}" class="edit-btn" title="Редактировать">
                    <i class="bi bi-pencil-square"></i>
                </a>
                <form th:id="'deleteForm_' + ${g.id}" th:action="@{'/genres/delete/' + ${g.id}}" method="post" style="display:inline;">
                    <button type="button" class="delete-btn"
                            th:attr="data-name=${g.name}, data-form-id='deleteForm_' + ${g.id}"
                            onclick="showModal(this)" title="Удалить">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(genres)}">
            <td colspan="2" class="text-center">Жанров пока нет</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Модальное окно -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <p id="modalMessage">Вы уверены, что хотите удалить жанр?</p>
        <div class="modal-buttons">
            <button class="confirm-btn" onclick="confirmDelete()">Удалить</button>
            <button class="cancel-btn" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let formToSubmit = null;

    function showModal(button) {
        const genreName = button.getAttribute('data-name');
        const formId = button.getAttribute('data-form-id');
        document.getElementById('modalMessage').textContent = `Удалить жанр «${genreName}»?`;
        formToSubmit = document.getElementById(formId);
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('deleteModal').style.display = 'none';
        formToSubmit = null;
    }

    function confirmDelete() {
        if (formToSubmit) {
            formToSubmit.submit();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === "Escape") {
            closeModal();
        }
    });
</script>

</body>
</html>
