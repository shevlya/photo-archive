<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали выставки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f4fc;
            color: #4b3f72;
            margin: 0;
            padding: 2em;
        }

        h1, h2 {
            color: #6a5acd;
        }

        p {
            background-color: #ffffff;
            border-left: 5px solid #cbb4f0;
            padding: 1em;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(150, 120, 200, 0.1);
        }

        select, input[type="submit"], button {
            padding: 0.5em 1em;
            border: none;
            border-radius: 6px;
            font-size: 1em;
        }

        select {
            background-color: #e7dcf9;
            color: #4b3f72;
        }

        button[type="submit"], button[type="button"] {
            background-color: #d8c3ff;
            color: #4b3f72;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 0.5em;
        }

        button[type="submit"]:hover,
        button[type="button"]:hover {
            background-color: #c3aaff;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            background-color: #f4ecff;
            margin-bottom: 0.5em;
            padding: 0.75em 1em;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 6px rgba(150, 120, 200, 0.1);
        }

        a {
            color: #6a5acd;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        form {
            margin: 0;
        }

        .add-photo-form {
            background-color: #fdfaff;
            padding: 1em;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(200, 170, 255, 0.2);
            margin-bottom: 1.5em;
        }

        .back-button {
            display: inline-block;
            margin-top: 2em;
            padding: 0.6em 1.2em;
            background-color: #e0d1f7;
            color: #4b3f72;
            border-radius: 6px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(148, 108, 207, 0.2);
        }

        .back-button:hover {
            background-color: #d0baf3;
            box-shadow: 0 6px 14px rgba(128, 88, 181, 0.3);
            text-decoration: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(75, 63, 114, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(100, 80, 160, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
            color: #4b3f72;
        }

        .modal-buttons {
            margin-top: 1.5em;
            display: flex;
            justify-content: space-between;
        }

        .confirm-btn, .cancel-btn {
            padding: 0.5em 1em;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 500;
        }

        .confirm-btn {
            background-color: #d8c3ff;
            color: #4b3f72;
        }

        .confirm-btn:hover {
            background-color: #c3aaff;
        }

        .cancel-btn {
            background-color: #f0e4ff;
            color: #4b3f72;
        }

        .cancel-btn:hover {
            background-color: #e0d1f7;
        }

    </style>
</head>
<body>

<h1 th:text="${exhibition.title}">Выставка</h1>

<p>
    <strong>Локация:</strong> <span th:text="${exhibition.location}"></span><br/>
    <strong>Описание:</strong> <span th:text="${exhibition.description}"></span><br/>
    <strong>Дата начала:</strong> <span th:text="${exhibition.startDate}"></span><br/>
    <strong>Дата окончания:</strong> <span th:text="${exhibition.endDate}"></span>
</p>

<div class="add-photo-form">
    <h2>Добавить фото в выставку</h2>
    <form th:action="@{'/exhibitions/' + ${exhibition.id} + '/add-photo'}" method="post">
        <select name="photoId">
            <option th:each="photo : ${allPhotos}" th:value="${photo.id}" th:text="${photo.title}"></option>
        </select>
        <button type="submit">
            <i class="bi bi-plus-circle"></i> Добавить
        </button>
    </form>
</div>

<h2>Фотоработы в этой выставке</h2>
<ul>
    <li th:each="photo : ${photosInExhibition}">
        <span th:text="${photo.title}">Фото</span>
        <form th:id="'delete-form-' + ${photo.id}"
              th:action="@{'/exhibitions/' + ${exhibition.id} + '/remove-photo'}"
              method="post" style="display:inline;">
            <input type="hidden" name="photoId" th:value="${photo.id}"/>
            <button type="button"
                    th:attr="data-name=${photo.title}, data-form-id='delete-form-' + ${photo.id}"
                    onclick="showModal(this)">
                <i class="bi bi-trash"></i> Удалить
            </button>
        </form>
    </li>
</ul>

<a href="/exhibitions" class="back-button">
    <i class="bi bi-arrow-left-circle"></i> Назад к списку
</a>

<!-- Модальное окно -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <p id="modalMessage">Вы уверены, что хотите удалить эту работу с выставки?</p>
        <div class="modal-buttons">
            <button class="confirm-btn" onclick="confirmDelete()">Удалить</button>
            <button class="cancel-btn" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script>
    let formToSubmit = null;

    function showModal(button) {
        const photoName = button.getAttribute('data-name');
        const formId = button.getAttribute('data-form-id');
        document.getElementById('modalMessage').textContent = `Удалить фото «${photoName}» из выставки?`;
        formToSubmit = document.getElementById(formId);
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('deleteModal').style.display = 'none';
        formToSubmit = null;
    }

    function confirmDelete() {
        if (formToSubmit) {
            formToSubmit.submit();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === "Escape") {
            closeModal();
        }
    });
</script>

</body>
</html>
