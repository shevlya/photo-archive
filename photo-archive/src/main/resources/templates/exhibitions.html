<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список выставок</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f4ff;
            color: #4b3f72;
            margin: 0;
            padding-top: 80px;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(140, 108, 207, 0.2);
        }

        .navbar-nav .nav-link {
            color: #4b3f72;
            font-weight: 600;
            margin-right: 1rem;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #6a5acd;
        }

        .profile-link {
            color: #4b3f72;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-link:hover {
            color: #6a5acd;
            text-decoration: none;
        }

        .profile-icon {
            font-size: 1.5rem;
        }

        h1 {
            color: #6a5acd;
            padding: 1rem 2rem 0;
        }

        table {
            width: 95%;
            margin: 1rem auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(150, 120, 200, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 1em;
            text-align: left;
            border-bottom: 1px solid #e0d6f5;
        }

        th {
            background-color: #e7dcf9;
            color: #4b3f72;
        }

        tr:hover {
            background-color: #f0e8ff;
        }

        a.button {
            background-color: #d8c3ff;
            padding: 0.5em 1em;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
            margin-left: 2rem;
            margin-top: 1rem;
            color: #4b3f72;
            font-weight: 500;
            text-decoration: none;
        }

        a.button:hover {
            background-color: #c3aaff;
            text-decoration: none;
        }

        a.button-outline {
            background-color: transparent;
            border: 2px solid #c3aaff;
            color: #6a5acd;
            padding: 0.4em 0.9em;
            border-radius: 6px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
        }

        a.button-outline:hover {
            background-color: #e0d1f7;
            color: #4b3f72;
            box-shadow: 0 4px 10px rgba(148, 108, 207, 0.15);
        }

        .bi {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/photographers">
            <img src="/logo.svg" alt="Логотип ФотоПортал" height="32" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/photoworks" th:classappend="${activePage == 'photoworks'} ? 'active'">Фотоработы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/exhibitions" th:classappend="${activePage == 'exhibitions'} ? 'active'">Выставки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/genres" th:classappend="${activePage == 'genres'} ? 'active'">Список жанров</a>
                </li>
            </ul>
            <div class="d-flex align-items-center ms-auto">
                <a href="/profile" class="profile-link">
                    <i class="bi bi-person-circle profile-icon"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<h1>Выставки</h1>

<a class="button" th:href="@{/exhibitions/new}">
    <i class="bi bi-plus-circle"></i> Добавить выставку
</a>

<table>
    <thead>
    <tr>
        <th>Название</th>
        <th>Место</th>
        <th>Даты</th>
        <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ex : ${exhibitions}">
        <td th:text="${ex.title}">Название</td>
        <td th:text="${ex.location}">Место</td>
        <td th:text="${ex.startDate} + ' - ' + ${ex.endDate}">Дата</td>
        <td>
            <a class="button-outline" th:href="@{/exhibitions/{id}(id=${ex.id})}">
                <i class="bi bi-eye"></i> Подробнее
            </a>
        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
