<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${genre.id != null} ? 'Редактировать жанр' : 'Добавить жанр'">Форма жанра</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f4fc;
      color: #4b3f72;
      margin: 0;
      padding: 2em;
    }

    h1 {
      color: #6a5acd;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(107, 76, 154, 0.2);
    }

    .form-label {
      color: #5d3f84;
    }

    .form-control:focus {
      border-color: #c9a3ec;
      box-shadow: 0 0 0 0.2rem rgba(161, 122, 217, 0.25);
    }

    .btn-save {
      background: linear-gradient(145deg, #d3b6f3, #b892e0);
      border: none;
      color: white;
      box-shadow: 0 4px 10px rgba(148, 108, 207, 0.3);
      transition: all 0.3s ease;
    }

    .btn-save:hover {
      background: linear-gradient(145deg, #b892e0, #a780d9);
      box-shadow: 0 6px 14px rgba(128, 88, 181, 0.35);
    }

    .btn-cancel {
      background-color: #e3d2f2;
      border: none;
      color: #4c3d69;
      box-shadow: 0 2px 6px rgba(140, 110, 180, 0.2);
    }

    .btn-cancel:hover {
      background-color: #d3c0ec;
      color: #3e2f5c;
    }
  </style>
</head>

<body>
<div class="container my-4">

  <h1 th:text="${genre.id != null} ? 'Редактировать жанр' : 'Добавить жанр'"></h1>

  <div th:if="${errorMessage}" class="alert alert-warning" role="alert" style="background-color: #f3eaff; color: #6a4ab0; border-color: #c9a3ec; margin-bottom: 1em;">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${errorMessage}"></span>
  </div>

  <form th:action="@{/genres}" th:object="${genre}" method="post" class="mt-4 p-4 rounded shadow-sm bg-white">
    <input type="hidden" th:if="${genre.id != null}" th:field="*{id}" />

    <div class="mb-3">
      <label for="name" class="form-label">Название жанра</label>
      <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Введите название" required />
    </div>

    <button type="submit" class="btn btn-save me-2">
      <i class="bi bi-check-circle me-1"></i>
      <span th:text="${genre.id != null} ? 'Обновить' : 'Сохранить'"></span>
    </button>

    <a href="/genres" class="btn btn-cancel">
      <i class="bi bi-x-circle me-1"></i> Отмена
    </a>
  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
