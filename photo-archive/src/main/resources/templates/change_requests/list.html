<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Запросы на изменение фотографов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #E6E0F8;
            color: #4B367C;
            padding: 2rem;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 80px;
        }

        h1 {
            color: #5E4B8B;
            margin-bottom: 2rem;
        }

        table {
            background-color: #F3F0FA;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(75, 54, 124, 0.15);
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead th {
            background-color: #C9C1E3;
            color: #3B2F5C;
            border: none;
            padding: 1em;
            text-align: left;
        }

        tbody tr:hover {
            background-color: #DAD3F0;
        }

        tbody td {
            vertical-align: middle;
            border-top: none;
            color: #4B367C;
            padding: 1em;
        }

        button.btn-success {
            background-color: #B8A3E0;
            border-color: #A48BD9;
            color: #3B2F5C;
            transition: background-color 0.3s ease;
        }

        button.btn-success:hover {
            background-color: #9B82D2;
            border-color: #886FC4;
            color: white;
        }

        button.btn-danger {
            background-color: #D8B4E2;
            border-color: #C49BD5;
            color: #5C3B5C;
            transition: background-color 0.3s ease;
        }

        button.btn-danger:hover {
            background-color: #C494D8;
            border-color: #AC7CC7;
            color: white;
        }

        form {
            display: inline-block;
        }

        /* Шапка (navbar) */
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(140, 108, 207, 0.2);
        }

        .navbar-nav .nav-link {
            color: #4b3f72;
            font-weight: 600;
            margin-right: 1rem;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #6a5acd;
        }

        .profile-link {
            margin-left: auto;
            color: #4B367C;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-link:hover {
            color: #6A5ACD;
            text-decoration: none;
        }

        .profile-icon {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/photographers">
            <img src="/logo.svg" alt="Логотип ФотоПортал" height="32" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/photoworks" th:classappend="${activePage == 'photoworks'} ? 'active'">Фотоработы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/exhibitions" th:classappend="${activePage == 'exhibitions'} ? 'active'">Выставки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/genres" th:classappend="${activePage == 'genres'} ? 'active'">Список жанров</a>
                </li>
            </ul>
            <div class="d-flex align-items-center ms-auto">
                <a href="/profile" class="profile-link">
                    <i class="bi bi-person-circle profile-icon"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<h1>Запросы на изменение данных фотографа</h1>
<table class="table table-bordered table-hover mt-4">
    <thead>
    <tr>
        <th>Фотограф</th>
        <th>Биография</th>
        <th>Контакты</th>
        <th>Специализация</th>
        <th>Запрошено</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="req : ${requests}">
        <td th:text="${req.photographer.firstName + ' ' + req.photographer.lastName}"></td>
        <td th:text="${req.suggestedBiography}">-</td>
        <td th:text="${req.suggestedContactInfo}">-</td>
        <td th:text="${req.suggestedSpecialization}">-</td>
        <td th:text="${#temporals.format(req.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
        <td>
            <form th:action="@{'/change-requests/approve/' + ${req.id}}" method="post">
                <button class="btn btn-success btn-sm">Принять</button>
            </form>
            <form th:action="@{'/change-requests/delete/' + ${req.id}}" method="post">
                <button class="btn btn-danger btn-sm">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
