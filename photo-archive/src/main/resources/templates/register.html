<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            background-color: #f3e8ff;
        }

        .form-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background-color: #ede9fe;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }

        h1 {
            color: #6d28d9;
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-purple {
            background-color: #a78bfa;
            color: white;
        }

        .btn-purple:hover {
            background-color: #8b5cf6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h1>Регистрация</h1>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input type="text" th:field="*{firstName}" class="form-control" id="firstName" required>
                <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input type="text" th:field="*{lastName}" class="form-control" id="lastName" required>
                <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" id="email" required>
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                <div class="text-danger" th:if="${emailError}" th:text="${emailError}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" th:field="*{password}" class="form-control" id="password" required>
                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-purple w-100">Зарегистрироваться</button>
        </form>

        <p class="text-danger text-center mt-3" th:if="${registrationError}" th:text="${registrationError}"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-mQ93cS+M8aU5fGTV2yL0cR7h1XgAaBMT5IRU8o3U6ZSlFVoYGl4E18ly9txkCe3Y"
        crossorigin="anonymous"></script>
</body>
</html>
